  - instance_id: account_database_primary
    service_id: account_service
    component_id: account_database
    site_id: bank_primary
    environment: production

  - instance_id: account_database_secondary
    service_id: account_service
    component_id: account_database
    site_id: bank_secondary
    environment: production
