schema_version: "1.0"

generator:
  synthetic: true

runtime:
  mode: accelerated
  speed_multiplier: 12.0

frequency:
  metrics:
    interval_seconds: 5

  logs:
    normal_per_second: 2
    warning_per_second: 8
    failure_per_second: 25

  infrastructure_tests:
    interval_seconds: 60

defaults:
  environment: production
  risk: medium