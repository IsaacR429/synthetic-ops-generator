scenario_id: BANK-06

name: Payment Service Site Failover

description: >
  Simulates loss of the primary Bank Alpha Payment API Service Instance.
  Operational evidence records primary-instance failure, explicit failover
  initiation, traffic switching to the secondary Service Instance, secondary
  activation and serving state, and subsequent recovery of the primary
  Service Instance. Generated source events describe observed facts only;
  resilience success, RTO compliance and residual-risk interpretation remain
  outside StreamOps.

family: resilience_dr

industry: banking

target:
  enterprise_id: bank_alpha
  business_stream_id: payments
  service_id: payment_service

  component_ids:
    - payment_api
    - payment_database
    - payment_worker

  environment: production

correlation:
  change_required: false

risk: high

initial_conditions:
  - Payment Service is operating normally.
  - The primary Payment API Service Instance is healthy and serving production traffic.
  - The secondary Payment API Service Instance is available for resilience operations.
  - Required Payment API infrastructure validations are active.
  - Payment Service baseline and benchmark configuration is valid.
  - No production Change is associated with the failover event.

trigger:
  source: infrastructure_test
  trigger_type: primary_payment_api_unavailable
  description: >
    Required infrastructure validation detects loss of availability on the
    primary Payment API Service Instance.

state_sequence:
  - initialising
  - normal
  - degraded
  - failure
  - remediation
  - recovery
  - completed

behaviours:
  - source: metric
    behaviour_id: metric_normal_healthy_baseline_at_payment_api_primary
    during_state: normal
    profile_id: healthy_baseline
    execution_node_id: payment_api_primary
    selection:
      metric_ids:
        - request_latency
        - error_rate
        - availability
    description: >
      The primary Payment API begins from a healthy production baseline.

  - source: infrastructure_test
    behaviour_id: infrastructure_test_normal_all_required_checks_pass_at_payment_api_primary
    during_state: normal
    profile_id: all_required_checks_pass
    execution_node_id: payment_api_primary
    description: >
      Required infrastructure validation confirms that the primary Payment API
      Service Instance is initially healthy.

  - source: infrastructure_test
    behaviour_id: infrastructure_test_failure_required_check_failed_at_payment_api_primary
    during_state: failure
    profile_id: required_check_failed
    execution_node_id: payment_api_primary
    description: >
      Required infrastructure validation detects that the primary Payment API
      Service Instance is unavailable.

  - source: resilience
    behaviour_id: resilience_failure_service_unavailable_at_payment_api_primary
    during_state: failure
    profile_id: service_unavailable
    execution_node_id: payment_api_primary
    continuous: false
    description: >
      A factual availability observation records that the primary Payment API
      Service Instance is unavailable.

  - source: resilience
    behaviour_id: resilience_failure_replication_observed_at_payment_api_primary_to_payment_api_secondary
    during_state: failure
    profile_id: replication_observed
    execution_node_id: payment_api_primary
    continuous: false
    resilience_replication:
      to_execution_node_id: payment_api_secondary
      replication_status: stopped
      last_successful_replication_offset_seconds: 60
    description: >
      A factual replication observation records that replication from the
      primary Payment API Service Instance to the configured secondary Service
      Instance is stopped. The last successful replication timestamp is
      reconstructed as 60 seconds before this observation. This is source
      evidence only and does not itself determine actual data loss or RPO
      compliance.

  - source: metric
    behaviour_id: metric_degraded_operational_degradation_at_payment_api_primary
    during_state: degraded
    profile_id: operational_degradation
    execution_node_id: payment_api_primary
    selection:
      metric_ids:
        - request_latency
        - error_rate
        - availability
    description: >
      Primary Payment API telemetry records degraded operational conditions
      during the availability loss.

  - source: log
    behaviour_id: log_failure_degradation_error_logs_at_payment_api_primary
    during_state: failure
    profile_id: degradation_error_logs
    execution_node_id: payment_api_primary
    description: >
      Primary Payment API logs expose request failures associated with the
      unavailable Service Instance.

  - source: resilience
    behaviour_id: resilience_remediation_failover_initiated_at_payment_api_primary_to_payment_api_secondary
    during_state: remediation
    profile_id: failover_initiated
    execution_node_id: payment_api_primary
    continuous: false
    resilience_transition:
      to_execution_node_id: payment_api_secondary
    description: >
      A factual resilience observation records initiation of failover from the
      primary Payment API Service Instance toward the configured secondary
      Service Instance.

  - source: resilience
    behaviour_id: resilience_remediation_traffic_switch_started_at_payment_api_primary_to_payment_api_secondary
    during_state: remediation
    profile_id: traffic_switch_started
    execution_node_id: payment_api_primary
    continuous: false
    resilience_transition:
      to_execution_node_id: payment_api_secondary
    description: >
      Traffic switching from the primary Payment API Service Instance toward
      the secondary Service Instance begins.

  - source: resilience
    behaviour_id: resilience_remediation_traffic_switch_completed_at_payment_api_primary_to_payment_api_secondary
    during_state: remediation
    profile_id: traffic_switch_completed
    execution_node_id: payment_api_primary
    continuous: false
    resilience_transition:
      to_execution_node_id: payment_api_secondary
    description: >
      Traffic switching from the primary Payment API Service Instance to the
      configured secondary Service Instance completes.

  - source: resilience
    behaviour_id: resilience_remediation_instance_activated_at_payment_api_secondary
    during_state: remediation
    profile_id: instance_activated
    execution_node_id: payment_api_secondary
    continuous: false
    description: >
      The secondary Payment API Service Instance is observed in an activated
      state.

  - source: resilience
    behaviour_id: resilience_remediation_service_available_at_payment_api_secondary
    during_state: remediation
    profile_id: service_available
    execution_node_id: payment_api_secondary
    continuous: false
    description: >
      A factual availability observation records that the secondary Payment API
      Service Instance is available during failover remediation. Availability
      does not by itself prove that production traffic is being served.

  - source: resilience
    behaviour_id: resilience_remediation_instance_serving_at_payment_api_secondary
    during_state: remediation
    profile_id: instance_serving
    execution_node_id: payment_api_secondary
    continuous: false
    description: >
      The secondary Payment API Service Instance is observed serving production
      traffic.

  - source: resilience
    behaviour_id: resilience_recovery_service_available_at_payment_api_primary
    during_state: recovery
    profile_id: service_available
    execution_node_id: payment_api_primary
    continuous: false
    description: >
      A factual availability observation records that the original primary
      Payment API Service Instance is available again. This recovery
      observation does not imply that traffic failed back to the primary.

  - source: infrastructure_test
    behaviour_id: infrastructure_test_recovery_all_required_checks_pass_at_payment_api_primary
    during_state: recovery
    profile_id: all_required_checks_pass
    execution_node_id: payment_api_primary
    description: >
      Required infrastructure validation observes recovery of the primary
      Payment API Service Instance.

  - source: metric
    behaviour_id: metric_recovery_operational_recovery_at_payment_api_primary
    during_state: recovery
    profile_id: operational_recovery
    execution_node_id: payment_api_primary
    selection:
      metric_ids:
        - request_latency
        - error_rate
        - availability
    description: >
      Primary Payment API operational telemetry returns to healthy reference
      conditions after the original availability loss.

  - source: metric
    behaviour_id: metric_recovery_operational_recovery_at_payment_api_secondary
    during_state: recovery
    profile_id: operational_recovery
    execution_node_id: payment_api_secondary
    selection:
      metric_ids:
        - request_latency
        - error_rate
        - availability
    continuous: true
    description: >
      Secondary Payment API telemetry remains within healthy operational
      reference conditions while the secondary instance continues serving.

  - source: log
    behaviour_id: log_recovery_recovery_operational_logs_at_payment_api_secondary
    during_state: recovery
    profile_id: recovery_operational_logs
    execution_node_id: payment_api_secondary
    continuous: true
    description: >
      Secondary Payment API logs record normal request processing while the
      secondary Service Instance remains the serving placement.

expected_result:
  scenario_id: BANK-06

  expected_outcome: successful

  expected_blocking_conditions:
    - primary_payment_api_unavailable

  expected_evidence:
    - primary_payment_api_healthy_baseline
    - primary_payment_api_failure
    - primary_payment_api_unavailable
    - primary_to_secondary_replication_stopped
    - primary_payment_api_degradation
    - failover_initiated
    - traffic_switch_started
    - traffic_switch_completed
    - secondary_payment_api_activated
    - secondary_payment_api_available
    - secondary_payment_api_serving
    - primary_payment_api_recovered
    - primary_payment_api_available_after_recovery
    - secondary_payment_api_recovery_metrics
    - secondary_payment_api_recovery_logs

  expected_incident_attribution: false

  expected_root_cause: payment_api_primary

  expected_insight: >
    The primary Payment API Service Instance became unavailable and replication
    toward the configured secondary Service Instance was observed stopped.
    Explicit failover and traffic-switch observations were followed by
    activation, availability and serving observations from the secondary
    Service Instance. The primary Service Instance subsequently became
    available again. These are factual observations only; no RTO, RPO,
    data-loss or DR-success conclusion is generated by this Scenario, and no
    failback observation is generated.

assumptions:
  - Required enterprise, site and Service Instance references exist.
  - Primary and secondary Payment API Service Instances represent distinct physical execution identities.
  - The failover destination is explicitly configured and is not inferred from site role.
  - Primary-instance failure does not by itself prove that failover occurred.
  - Secondary activation does not by itself prove that production traffic is being served.
  - Secondary availability does not by itself prove that production traffic is being served.
  - Secondary serving is represented by an explicit factual resilience observation.
  - Replication state and last-successful-replication time are factual source observations and do not by themselves determine actual data loss or RPO compliance.
  - Primary recovery availability does not imply that traffic failed back to the primary Service Instance.
  - Resilience observations remain bounded and are not scheduled continuously.
  - Continuous recovery telemetry may continue from the secondary Service Instance.
  - DR success, RTO compliance, resilience adequacy and residual risk are not generated as StreamOps source facts.
  - No production Change identifier is generated for this Scenario.
  - The Test Oracle remains separate from generated source events.

tags:
  - banking
  - payments
  - resilience
  - disaster_recovery
  - failover
  - service_instance
  - site_failover
  - recovery
  - no_change
