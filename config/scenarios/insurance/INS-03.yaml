scenario_id: INS-03

name: Broker Portal Certificate Failure

description: >
  Simulates a planned production Change to the Insurer Alpha
  Broker Portal where required approvals are present and
  pre-implementation dependency connectivity and DNS validation
  succeed, but mandatory certificate validation fails before
  deployment. Generated source events describe the observed
  validation facts only; implementation blocking and remediation
  remain expected platform interpretation in the Test Oracle.

family: change_validation

industry: insurance

target:
  enterprise_id: insurer_alpha
  business_stream_id: customer_broker
  service_id: broker_portal

  component_ids:
    - broker_web

  environment: production

correlation:
  change_required: true

risk: medium

initial_conditions:
  - Change exists and is approved.
  - Broker Portal is operating normally before implementation.
  - Required pre-implementation infrastructure validations are planned.
  - Dependency connectivity validation is required.
  - DNS resolution validation is required.
  - Certificate validation is required.
  - No deployment occurs until mandatory pre-implementation validation completes.

trigger:
  source: infrastructure_test

  trigger_type: broker_portal_preimplementation_validation

  description: >
    Execute mandatory pre-implementation infrastructure validation
    for the Broker Portal before deployment is allowed to begin.

state_sequence:
  - initialising
  - normal
  - degraded
  - failure
  - remediation
  - recovery
  - completed

behaviours:
  - source: itsm
    behaviour_id: itsm_normal_approved_broker_portal_change
    during_state: normal
    profile_id: approved_change
    description: >
      The Broker Portal Change exists with required implementation
      approval and valid Change correlation.

  - source: infrastructure_test
    behaviour_id: infrastructure_test_normal_broker_prerequisites_pass
    during_state: normal
    profile_id: all_required_checks_pass
    execution_node_id: broker_web
    check_selection:
      check_definition_ids:
        - infrastructure.dependency_connectivity
        - infrastructure.dns_resolution
    description: >
      Broker Portal dependency connectivity and DNS resolution
      validations complete successfully before implementation.

  - source: infrastructure_test
    behaviour_id: infrastructure_test_failure_certificate_validation_failed
    during_state: failure
    profile_id: required_check_failed
    execution_node_id: broker_web
    check_selection:
      check_definition_ids:
        - infrastructure.certificate_validation
    description: >
      Mandatory Broker Portal certificate validation fails before
      deployment begins.

expected_result:
  scenario_id: INS-03

  expected_decision: fail
  expected_action: remediate
  expected_outcome: failed

  expected_blocking_conditions:
    - mandatory_certificate_validation_failed

  expected_evidence:
    - change_approval
    - dependency_connectivity_validation
    - dns_resolution_validation
    - certificate_validation_failure

  expected_incident_attribution: false

  expected_root_cause: null

  expected_insight: >
    Broker Portal dependency connectivity and DNS resolution passed,
    but mandatory certificate validation failed before deployment.
    The validation result requires remediation before implementation
    can safely proceed.

assumptions:
  - Required enterprise and topology references exist.
  - broker_web belongs to the Broker Portal production Service.
  - Dependency connectivity and DNS validation are factual pre-implementation checks.
  - Certificate validation failure is represented as factual operational-test evidence.
  - Certificate failure does not itself prove the underlying certificate root cause.
  - No Deployment event is generated by this Scenario.
  - No operational Incident is created by this pre-deployment validation failure.
  - Remediation is an expected platform action and is not emitted as a StreamOps source fact.
  - The Test Oracle remains separate from generated source events.

tags:
  - insurance
  - broker_portal
  - production_change
  - predeployment_validation
  - certificate_failure
  - dns
  - connectivity
