name: synthetic-ops-streaming

networks:
  streaming_network:
    driver: bridge

volumes:
  redpanda_data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    container_name: synthetic-ops-redpanda

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - info

    ports:
      - "19092:19092"
      - "19644:9644"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    networks:
      - streaming_network
