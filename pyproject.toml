[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ops-generator"
version = "0.1.0"
description = "Scenario-driven synthetic operational data generator for Operational Intelligence testing."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "numpy>=1.26",
    "Faker>=24",
    "fastapi>=0.141",
    "uvicorn>=0.51",
    "reportlab>=4"
]

[project.optional-dependencies]
streaming = [
    "aiokafka>=0.12"
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pypdf>=5",
    "ruff>=0.5",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synthetic_ops_generator.reporting" = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
