[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ops-generator"
version = "0.1.0"
description = "Scenario-driven synthetic operational data generator for Operational Intelligence testing."
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "numpy>=1.26",
    "Faker>=24"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"